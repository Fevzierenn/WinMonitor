[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winmonitor"
version = "1.2.0"
description = "Terminal system, process and port monitor for Windows 11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WinMonitor contributors" }]
keywords = ["windows", "monitoring", "ports", "processes", "tui", "netstat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
    "textual>=0.80",
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "textual-dev>=1.5",
]

[project.scripts]
winmonitor = "winmonitor.cli:main"

# No Homepage is declared: the project is not published anywhere yet, and a
# placeholder URL in the package metadata is worse than none. Add one here when
# it gets a real home.

[tool.setuptools.packages.find]
include = ["winmonitor*"]

[tool.setuptools.package-data]
winmonitor = ["ui/*.tcss", "config/*.toml"]

# ---------------------------------------------------------------- tooling ---

[tool.black]
line-length = 100
target-version = ["py312"]
# The original prototype scripts are kept as written; see the ruff note below.
force-exclude = "port_monitor(_v001)?\\.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["winmonitor", "tests"]
# The two loose port_monitor*.py scripts at the repository root are the
# original prototypes that WinMonitor grew out of. They are kept for reference
# and are deliberately not held to this project's style rules.
extend-exclude = ["port_monitor.py", "port_monitor_v001.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff specific
]
ignore = [
    "B008",     # typer uses function calls in argument defaults by design
    # A terminal UI is built from box-drawing and typographic characters:
    # U+2588/U+2591 draw the meters, U+2026 is the truncation ellipsis, and
    # U+2192 points at a remote endpoint. They are deliberate, not homoglyph
    # mistakes, and replacing them with ASCII would degrade the interface.
    "RUF001",   # ambiguous unicode in strings
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["winmonitor"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose to cover parsing and caching.
"tests/*" = ["E501", "SLF001"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["winmonitor"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
